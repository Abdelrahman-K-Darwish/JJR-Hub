<svg xmlns="http://www.w3.org/2000/svg" width="740" height="708" viewBox="0 0 740 708" role="img" aria-labelledby="title desc">
<title id="title">WF-002 · Authorization &amp; Scoped Resource Access</title><desc id="desc">Never treat hidden buttons, route guards, or client-side filters as security.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B365D"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#F8F7F4"/><text x="40" y="42" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F2340">WF-002 · Authorization &amp; Scoped Resource Access</text>
<path d="M 385.0 128 L 385.0 160" fill="none" stroke="#1B365D" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 385.0 218 L 385.0 250" fill="none" stroke="#1B365D" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 385.0 308 L 385.0 340" fill="none" stroke="#1B365D" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 385.0 420 L 385.0 445.0 L 170.0 445.0 L 170.0 470" fill="none" stroke="#1B365D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="285.5" y="440.0" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5A6B80">YES</text>
<path d="M 385.0 420 L 385.0 445.0 L 580.0 445.0 L 580.0 470" fill="none" stroke="#1B365D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="490.5" y="440.0" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5A6B80">NO</text>
<path d="M 170.0 528 L 170.0 570" fill="none" stroke="#1B365D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270" y="70" width="230" height="58" rx="14" fill="#FFFFFF" stroke="#D0CCC4" stroke-width="1.5" filter="url(#shadow)"/>
<text x="385.0" y="91.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">UI requests protected</text>
<text x="385.0" y="108.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">resource</text>
<text x="385.0" y="118" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5A6B80">route / API call</text>
<rect x="270" y="160" width="230" height="58" rx="14" fill="#eef5fb" stroke="#1B365D" stroke-width="2" filter="url(#shadow)"/>
<text x="385.0" y="189.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">Backend validates identity</text>
<text x="385.0" y="208" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5A6B80">authenticated?</text>
<rect x="270" y="250" width="230" height="58" rx="14" fill="#eef5fb" stroke="#1B365D" stroke-width="2" filter="url(#shadow)"/>
<text x="385.0" y="271.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">Resolve capability on</text>
<text x="385.0" y="288.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">resource</text>
<text x="385.0" y="298" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5A6B80">role + membership + grants</text>
<polygon points="385.0,340 500,380.0 385.0,420 270,380.0" fill="#FFFFFF" stroke="#1B365D" stroke-width="2" filter="url(#shadow)"/>
<text x="385.0" y="372.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">Authorized for this</text>
<text x="385.0" y="389.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">resource?</text>
<text x="385.0" y="410" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5A6B80">backend decision</text>
<rect x="60" y="470" width="220" height="58" rx="14" fill="#f1faed" stroke="#4CBB17" stroke-width="2" filter="url(#shadow)"/>
<text x="170.0" y="499.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">Return only scoped data</text>
<text x="170.0" y="518" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5A6B80">security-trimmed</text>
<rect x="470" y="470" width="220" height="58" rx="14" fill="#fff6fa" stroke="#E91E8C" stroke-width="2" filter="url(#shadow)"/>
<text x="580.0" y="491.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">Return locked / forbidden</text>
<text x="580.0" y="508.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">state</text>
<text x="580.0" y="518" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5A6B80">no confidential payload</text>
<rect x="60" y="570" width="220" height="58" rx="14" fill="#FFFFFF" stroke="#D0CCC4" stroke-width="1.5" filter="url(#shadow)"/>
<text x="170.0" y="591.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">Render permitted UI</text>
<text x="170.0" y="608.0" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2340">actions</text>
<text x="170.0" y="618" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5A6B80">client convenience</text>
<text x="40" y="684" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#5A6B80">Never treat hidden buttons, route guards, or client-side filters as security.</text>
</svg>
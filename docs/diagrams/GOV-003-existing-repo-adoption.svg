<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">GOV-003 · Existing Repo Adoption</title><desc id="desc">Safe adoption sequence for the existing JJR Hub repository.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1B365D"/></marker></defs>
<rect width="100%" height="100%" fill="#F8F7F4"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0F2340">GOV-003 · Existing Repo Adoption</text>
<g font-family="Arial,sans-serif">
<g><rect x="45" y="85" width="430" height="64" rx="10" fill="#fff" stroke="#D0CCC4" stroke-width="2"/><circle cx="75" cy="117" r="18" fill="#1B365D"/><text x="75" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="105" y="112" font-size="15" font-weight="700" fill="#0F2340">Protect current work</text><text x="105" y="132" font-size="12" fill="#5A6B80">Commit/stash + backup branch</text></g>
<g><rect x="525" y="85" width="430" height="64" rx="10" fill="#EDF3EA" stroke="#D0CCC4" stroke-width="2"/><circle cx="555" cy="117" r="18" fill="#1B365D"/><text x="555" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="585" y="112" font-size="15" font-weight="700" fill="#0F2340">Install governance files</text><text x="585" y="132" font-size="12" fill="#5A6B80">Replace CLAUDE.md; add final SOP/docs</text></g>
<g><rect x="45" y="180" width="430" height="64" rx="10" fill="#fff" stroke="#D0CCC4" stroke-width="2"/><circle cx="75" cy="212" r="18" fill="#1B365D"/><text x="75" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="105" y="207" font-size="15" font-weight="700" fill="#0F2340">Archive stale process docs</text><text x="105" y="227" font-size="12" fill="#5A6B80">Move, do not delete immediately</text></g>
<g><rect x="525" y="180" width="430" height="64" rx="10" fill="#fff" stroke="#D0CCC4" stroke-width="2"/><circle cx="555" cy="212" r="18" fill="#1B365D"/><text x="555" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="585" y="207" font-size="15" font-weight="700" fill="#0F2340">Audit current repository</text><text x="585" y="227" font-size="12" fill="#5A6B80">Routes, components, services, pages, scripts</text></g>
<g><rect x="45" y="275" width="430" height="64" rx="10" fill="#fff" stroke="#D0CCC4" stroke-width="2"/><circle cx="75" cy="307" r="18" fill="#1B365D"/><text x="75" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="105" y="302" font-size="15" font-weight="700" fill="#0F2340">Run baseline checks</text><text x="105" y="322" font-size="12" fill="#5A6B80">Record failures before changes</text></g>
<g><rect x="525" y="275" width="430" height="64" rx="10" fill="#EDF3EA" stroke="#D0CCC4" stroke-width="2"/><circle cx="555" cy="307" r="18" fill="#1B365D"/><text x="555" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="585" y="302" font-size="15" font-weight="700" fill="#0F2340">Classify current code</text><text x="585" y="322" font-size="12" fill="#5A6B80">KEEP / REFINE / REPLACE / OPEN</text></g>
<g><rect x="45" y="370" width="430" height="64" rx="10" fill="#fff" stroke="#D0CCC4" stroke-width="2"/><circle cx="75" cy="402" r="18" fill="#1B365D"/><text x="75" y="407" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="105" y="397" font-size="15" font-weight="700" fill="#0F2340">Review Active Projects</text><text x="105" y="417" font-size="12" fill="#5A6B80">Approve pattern; do not blindly rebuild</text></g>
<g><rect x="525" y="370" width="430" height="64" rx="10" fill="#fff" stroke="#D0CCC4" stroke-width="2"/><circle cx="555" cy="402" r="18" fill="#1B365D"/><text x="555" y="407" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text><text x="585" y="397" font-size="15" font-weight="700" fill="#0F2340">Continue migration</text><text x="585" y="417" font-size="12" fill="#5A6B80">Small, reversible, workflow-aware changes</text></g>
</g>
<g stroke="#1B365D" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M475 117 L520 117"/><path d="M740 149 L740 175"/><path d="M475 212 L520 212"/><path d="M740 244 L740 270"/><path d="M475 307 L520 307"/><path d="M740 339 L740 365"/><path d="M475 402 L520 402"/></g>
<text x="40" y="472" font-family="Arial,sans-serif" font-size="12" fill="#5A6B80">Do not delete src/, legacy/, docs/architecture/, scripts/, or working configuration simply because the final SOP is newer.</text>
